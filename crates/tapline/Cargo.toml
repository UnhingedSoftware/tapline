[package]
name = "tapline"
description = "Install Steam apps and Workshop content: the library other Rust projects link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tapline-cdn = { workspace = true }
tapline-event = { workspace = true }
tapline-fs = { workspace = true }
tapline-ids = { workspace = true }
tapline-io = { workspace = true }
tapline-chunk = { workspace = true }
tapline-manifest = { workspace = true }
tapline-net = { workspace = true }
tapline-pics = { workspace = true }
tapline-proto = { workspace = true }
tapline-rt-tokio = { workspace = true }
tapline-wire = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
