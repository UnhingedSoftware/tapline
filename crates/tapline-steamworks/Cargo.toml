[package]
name = "tapline-steamworks"
description = "Optional bridge to a running Steam client through Valve's SDK, for account-scoped Workshop actions like subscribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Unpublished: the one place tapline touches Valve's closed SDK.
publish = false

[dependencies]
tapline-ids = { workspace = true }
libloading = "0.8"

[lints.rust]
# The workspace `forbid(unsafe_code)` cannot be lifted, so lints are restated here.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
