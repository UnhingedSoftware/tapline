[package]
name = "tapline-steamworks"
description = "Optional bridge to a running Steam client through Valve's SDK, for account-scoped Workshop actions like subscribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

publish = false

[dependencies]
tapline-ids = { workspace = true }
libloading = "0.8"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
