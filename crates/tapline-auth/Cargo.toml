[package]
name = "tapline-auth"
description = "Signing in: password RSA encryption, QR sessions, Steam Guard, and the refresh-token store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
rsa = { workspace = true }
tapline-ids = { workspace = true }
tapline-vdf = { workspace = true }
zeroize = { workspace = true }

[features]
# Off by default: a headless game-server node usually has no keyring daemon.
keyring = ["dep:keyring"]

[dependencies.keyring]
version = "3"
optional = true
default-features = false
features = ["sync-secret-service", "crypto-rust"]

[lints]
workspace = true
