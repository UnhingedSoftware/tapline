[package]
name = "tapline-ffi"
description = "The C ABI for tapline, so Deno, Bun and Node can install Steam apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "tapline_ffi"
# cdylib for the JS runtimes, which all load a plain shared library; staticlib
# so a C or Rust host can link the same surface without a second artifact.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tapline = { workspace = true }
tapline-ids = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

# Not `workspace = true`. The workspace forbids unsafe, and `forbid` cannot be
# lifted by an inner `allow` — which is the point of it. A C ABI cannot be
# written without raw pointers, so this crate opts out of that one lint by
# hand and restates every other guarantee rather than inheriting a weakened
# set. The other seventeen crates keep `forbid` untouched.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
# A panic here is a panic inside someone's Deno or Node process, across an FFI
# boundary that cannot unwind. These matter more here than anywhere else.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
