[package]
name = "tapline-ffi"
description = "The C ABI for tapline, so Deno, Bun and Node can install Steam apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "tapline_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tapline = { workspace = true }
tapline-ids = { workspace = true }
tapline-gmad = { workspace = true }
tapline-pipe = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
