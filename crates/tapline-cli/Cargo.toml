[package]
name = "tapline-cli"
description = "The tapline binary: a steamcmd-compatible command line, plus a modern one"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# The default build links the unpublished Steam-client bridge.
publish = false

[[bin]]
name = "tapline"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tapline = { workspace = true }
tapline-auth = { workspace = true }
tapline-gmad = { workspace = true }
tapline-pipe = { workspace = true }
tapline-ids = { workspace = true }
qrcode = { workspace = true }
# Links Valve's closed SDK; opt-in only.
tapline-steamworks = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
# On by default; the container turns it off (`--no-default-features`).
default = ["steamworks"]
steamworks = ["dep:tapline-steamworks"]

[lints]
workspace = true
