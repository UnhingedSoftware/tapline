[package]
name = "tapline-cli"
description = "The tapline binary: a steamcmd-compatible command line, plus a modern one"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Not on crates.io. The default build links the Steam-client bridge, which
# is not published, and the binary is shipped as a prebuilt release artifact
# rather than via `cargo install`. The libraries below it still publish.
publish = false

[[bin]]
name = "tapline"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tapline = { workspace = true }
tapline-auth = { workspace = true }
tapline-gmad = { workspace = true }
tapline-pipe = { workspace = true }
tapline-ids = { workspace = true }
qrcode = { workspace = true }
# Off by default. Links Valve's closed SDK to reach a running client's session
# for account-scoped Workshop actions; opt-in only, so the default binary and
# the container never touch it.
tapline-steamworks = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
# On by default: the shipped binary can subscribe through a running Steam
# client. The container turns it off (`--no-default-features`) — there is no
# Steam in a container — and it is a runtime dlopen, so a machine without the
# SDK still builds and runs everything else.
default = ["steamworks"]
steamworks = ["dep:tapline-steamworks"]

[lints]
workspace = true
