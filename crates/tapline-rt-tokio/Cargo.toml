[package]
name = "tapline-rt-tokio"
description = "The tokio runtime: a WebSocket transport to Steam's CMs, an HTTP client for the CDN, and a positional file sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# The only crate in the workspace that opens a socket, and therefore the only one
# that depends on tokio. A service with its own reactor links `tapline` without
# inheriting ours.
[dependencies]
rustls = { workspace = true }
tapline-crypto = { workspace = true }
tapline-io = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "time", "fs", "macros", "sync"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tapline-io = { workspace = true, features = ["testing"] }
# The doctest and live_cm drive a real session, which is the only way to show
# what this crate is for.
#
# Nothing higher up the stack belongs here. The probes that needed a manifest
# or PICS now live in `tapline`'s tests: a dev-dependency pointing up the DAG
# made a cycle that no publish order can satisfy — manifest -> pics ->
# rt-tokio -> manifest — and cargo resolves dev-dependencies even with
# --no-verify, so the first release could not be cut at all.
tapline-net = { workspace = true }
tapline-proto = { workspace = true }
tapline-wire = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
