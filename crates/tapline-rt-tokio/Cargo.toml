[package]
name = "tapline-rt-tokio"
description = "The tokio runtime: a WebSocket transport to Steam's CMs, an HTTP client for the CDN, and a positional file sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
rustls = { workspace = true }
tapline-crypto = { workspace = true }
tapline-io = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "time", "fs", "macros", "sync"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tapline-io = { workspace = true, features = ["testing"] }
tapline-net = { workspace = true }
tapline-proto = { workspace = true }
tapline-wire = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
