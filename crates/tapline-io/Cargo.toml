[package]
name = "tapline-io"
description = "The IO seam: traits for the socket, the HTTP fetcher, the file sink and the clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Traits only, no implementations, and therefore no dependencies. This is the
# crate that keeps `tokio` out of every other crate's graph.
[dependencies]

[features]
# In-memory doubles and a runtime-free executor, for testing the protocol
# without a socket. Off by default so they never reach a production build.
testing = []

[dev-dependencies]
# The crate's own tests exercise its doubles.
tapline-io = { path = ".", features = ["testing"] }

[lints]
workspace = true
