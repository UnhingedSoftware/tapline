[workspace]
resolver = "3"
members = [
    "crates/tapline",
    "crates/tapline-auth",
    "crates/tapline-cdn",
    "crates/tapline-cli",
    "crates/tapline-crypto",
    "crates/tapline-event",
    "crates/tapline-ids",
    "crates/tapline-proto",
    "crates/tapline-io",
    "crates/tapline-chunk",
    "crates/tapline-ext",
    "crates/tapline-ffi",
    "crates/tapline-gmad",
    "crates/tapline-fs",
    "crates/tapline-manifest",
    "crates/tapline-net",
    "crates/tapline-pics",
    "crates/tapline-pipe",
    "crates/tapline-rt-tokio",
    "crates/tapline-state",
    "crates/tapline-steamworks",
    "crates/tapline-vdf",
    "crates/tapline-wire",
    "crates/tapline-zip",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/UnhingedSoftware/tapline"
homepage = "https://github.com/UnhingedSoftware/tapline"
readme = "README.md"
keywords = ["steam", "steamcmd", "depot", "workshop", "steampipe"]
categories = ["network-programming", "game-development", "command-line-utilities"]
rust-version = "1.85"

[workspace.dependencies]
tapline-wire = { path = "crates/tapline-wire", version = "0.1.0" }
tapline-ids = { path = "crates/tapline-ids", version = "0.1.0" }
tapline-proto = { path = "crates/tapline-proto", version = "0.1.0" }
tapline = { path = "crates/tapline", version = "0.1.0" }
tapline-auth = { path = "crates/tapline-auth", version = "0.1.0" }
tapline-cdn = { path = "crates/tapline-cdn", version = "0.1.0" }
tapline-cli = { path = "crates/tapline-cli", version = "0.1.0" }
tapline-crypto = { path = "crates/tapline-crypto", version = "0.1.0" }
tapline-state = { path = "crates/tapline-state", version = "0.1.0" }
tapline-steamworks = { path = "crates/tapline-steamworks", version = "0.1.0" }
tapline-vdf = { path = "crates/tapline-vdf", version = "0.1.0" }
tapline-chunk = { path = "crates/tapline-chunk", version = "0.1.0" }
tapline-event = { path = "crates/tapline-event", version = "0.1.0" }
tapline-io = { path = "crates/tapline-io", version = "0.1.0" }
tapline-fs = { path = "crates/tapline-fs", version = "0.1.0" }
tapline-manifest = { path = "crates/tapline-manifest", version = "0.1.0" }
tapline-net = { path = "crates/tapline-net", version = "0.1.0" }
tapline-pics = { path = "crates/tapline-pics", version = "0.1.0" }
tapline-rt-tokio = { path = "crates/tapline-rt-tokio", version = "0.1.0" }
tapline-ffi = { path = "crates/tapline-ffi", version = "0.1.0" }
tapline-ext = { path = "crates/tapline-ext", version = "0.1.0" }
tapline-gmad = { path = "crates/tapline-gmad", version = "0.1.0" }
tapline-pipe = { path = "crates/tapline-pipe", version = "0.1.0" }
tapline-zip = { path = "crates/tapline-zip", version = "0.1.0" }

tokio = { version = "1", default-features = false }
rayon = "1"
bytes = "1"

rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

lzma-rs = "0.3"
ruzstd = "0.9"
miniz_oxide = "0.8"

cap-std = "3"
tracing = { version = "0.1", default-features = false, features = ["std"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"

[profile.dev]
codegen-units = 256
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.small]
inherits = "release"
opt-level = "z"
panic = "abort"
