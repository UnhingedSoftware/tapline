# cargo-deny keeps the dependency floor a floor.
#
# tapline is linked into other people's game-server hosts, so every crate in the
# tree is something they inherit. The rules below make adding one a visible
# decision rather than a side effect of reaching for a convenient API.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": a timing sidechannel in the `rsa`
    # crate that can recover a key. There is no fixed version; the maintainers
    # have not shipped one.
    #
    # It applies to RSA operations that use the *private* key, which is what
    # leaks timing. tapline never holds an RSA private key and never performs a
    # private-key operation. Its only use of RSA is encrypting a password to
    # Steam's public key during credentialed login, and the CM transport is
    # WebSocket-over-TLS, so the old handshake that encrypted a session key to
    # Valve's universe key does not exist here either.
    #
    # Reviewed 2026-08-26. If tapline ever decrypts or signs with RSA, this
    # entry stops being true and must be removed rather than extended.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# MPL-2.0 for our own crates; the rest is what the pure-Rust ecosystem uses.
allow = [
    # tapline's own crates.
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots, which is Mozilla's CA bundle repackaged. The data licence
    # rather than a code licence, because the crate is the trust store, and it
    # is permissive: use, modify and redistribute, with no copyleft reach into
    # anything that links it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Left off deliberately. It does not apply to publishable crates -- crates.io
# rejects a path-only dependency -- so the fix was to give the internal
# dependencies the versions they need to be published at all, rather than to
# tell cargo-deny to stop looking.

# A C toolchain in the tree breaks the static musl build and the "no build
# dependencies you did not ask for" promise. These are the usual ways it sneaks
# back in.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "cmake" },
    { name = "cc", wrappers = ["ring"] },
    # We ship our own HTTP/1.1 client and our own protobuf codec; if one of
    # these appears, something pulled in a stack we deliberately do not have.
    { name = "hyper" },
    { name = "reqwest" },
    { name = "prost" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
