name: Docker
# Builds the scratch image and pushes it to GHCR, so a user runs tapline with
# one command and no clone:
#
#   docker run --rm -v /srv/gmod:/data ghcr.io/unhingedsoftware/tapline \
#     app download 4020 --dir /data
#
# Fires on a version tag, and by hand. The image is the same `Dockerfile` the
# repo ships — one static musl binary on scratch, built --no-default-features.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push, e.g. v0.2.0. Blank = latest only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/unhingedsoftware/tapline

jobs:
  image:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` always, plus the version when there is one. A tag push carries
      # its own ref; a manual run takes it from the input, or ships latest alone.
      - name: Work out the tags
        id: tags
        run: |
          TAGS="${IMAGE}:latest"
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -n "$VERSION" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION#v}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # So `docker pull` on another arch fails loudly rather than running an
          # x86_64 binary through emulation and confusing everyone.
          platforms: linux/amd64
