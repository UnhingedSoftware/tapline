name: Release
# Produces a fully-populated DRAFT release to review and Publish. Kick off from
# Actions -> Release -> Run workflow (optionally type a version; blank = auto
# from Conventional Commits).
#
# One job on purpose. The obvious shape is prepare -> test -> build -> release,
# passing the changelog and the binaries between them as artifacts — and that
# shape stops working the moment the account's Actions artifact storage is
# full, which is how this workflow first failed. Nothing here needs to outlive
# the job that made it, so nothing is uploaded anywhere but the release itself.
#
# Artifacts, both standalone (download, chmod +x, run):
#   tapline-linux-x86_64             the command line
#   libtapline_ffi-linux-x86_64.so   the C ABI the JavaScript bindings load
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.2.0. Blank = auto-detect from Conventional Commits."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff reads the history to work out the version and the notes.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          if [ -n "$input" ]; then
            version="$input"; case "$version" in v*) ;; *) version="v$version" ;; esac
          else
            raw="$(git cliff --bumped-version 2>/dev/null || true)"
            ver="${raw#v}"; if [ -z "$ver" ] || [ "$ver" = "0.0.0" ]; then ver="0.1.0"; fi
            version="v$ver"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Generate changelog
        run: |
          set -euo pipefail
          git cliff --unreleased --tag "${{ steps.version.outputs.version }}" --strip all -o RELEASE_NOTES.md
          # A release with no notes is a release nobody can read.
          test -s RELEASE_NOTES.md || echo "Initial release." > RELEASE_NOTES.md

      # The gate: nothing ships from a tree with failing tests. The live tests
      # that talk to Steam stay ignored — a release must not depend on Valve
      # being reachable.
      - run: cargo test --workspace

      - name: Set crate version
        run: |
          v="${{ steps.version.outputs.version }}"; v="${v#v}"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$v\"/" Cargo.toml

      - run: cargo build --release -p tapline-cli -p tapline-ffi

      - name: Name the artifacts
        run: |
          set -euo pipefail
          cp target/release/tapline tapline-linux-x86_64
          cp target/release/libtapline_ffi.so libtapline_ffi-linux-x86_64.so
          chmod +x tapline-linux-x86_64
          ls -la tapline-linux-x86_64 libtapline_ffi-linux-x86_64.so

      - name: Create or update the draft
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          files="tapline-linux-x86_64 libtapline_ffi-linux-x86_64.so"
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Downloads

          | File | What it is |
          | --- | --- |
          | `tapline-linux-x86_64` | the command line — `chmod +x`, run |
          | `libtapline_ffi-linux-x86_64.so` | the C ABI the JavaScript bindings load |
          | `tapline-macos-aarch64` | the command line for macOS (Apple Silicon) |
          | `libtapline_ffi-macos-*.dylib` | the same C ABI for macOS |

          EOF
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V exists — updating in place"
            gh release edit "$V" --draft --title "$V" --notes-file RELEASE_NOTES.md
            # Cleared by name first: a run cancelled mid-upload leaves a
            # half-created asset, and the API then answers 400 for a fresh
            # upload of that name rather than replacing it. Deleting is allowed
            # to fail — usually it is simply not there.
            for f in $files; do
              gh release delete-asset "$V" "$f" --yes 2>/dev/null || true
            done
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$V" $files --clobber; then uploaded=1; break; fi
              echo "upload attempt $attempt failed; retrying in 20s"
              sleep 20
            done
            [ "$uploaded" = 1 ] || { echo "::error::could not upload assets"; exit 1; }
          else
            echo "creating draft $V"
            gh release create "$V" --draft --title "$V" --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES.md $files
          fi
          echo "Draft $V ready."

  # macOS artifacts, uploaded into the draft the job above created. The
  # self-hosted runners are Linux, so these are GitHub-hosted.
  macos:
    needs: release
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64

      - name: Set crate version
        run: |
          python3 - <<'PY'
          import os, re
          want = os.environ["V"].lstrip("v")
          text = open("Cargo.toml").read()
          text = re.sub(r'^version = "\d+\.\d+\.\d+"', f'version = "{want}"', text, count=1, flags=re.M)
          open("Cargo.toml", "w").write(text)
          PY

      - run: cargo build --release -p tapline-cli -p tapline-ffi

      - name: Name the artifacts
        run: |
          set -euo pipefail
          cp target/release/tapline "tapline-macos-aarch64"
          cp target/release/libtapline_ffi.dylib "libtapline_ffi-macos-aarch64.dylib"
          chmod +x "tapline-macos-aarch64"
          ls -la tapline-macos-* libtapline_ffi-macos-*

      - name: Upload into the draft
        run: |
          set -euo pipefail
          files="tapline-macos-aarch64 libtapline_ffi-macos-aarch64.dylib"
          for f in $files; do
            gh release delete-asset "$V" "$f" --yes 2>/dev/null || true
          done
          for attempt in 1 2 3; do
            if gh release upload "$V" $files --clobber; then exit 0; fi
            echo "upload attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error::could not upload the macOS assets"; exit 1
