name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A dependency that fails to build is a dependency we should not have.
  CARGO_NET_RETRY: 3

# Every job here reads the repository and writes nothing back, so the token that
# reaches them needs nothing more. It matters most when a runner is self-hosted
# and executing pull-request code: a build script from a fork runs with whatever
# the workflow was handed. `persist-credentials: false` on each checkout keeps
# the token out of .git/config on the runner for the same reason; nothing in the
# workspace is a git dependency, so no step needs it to fetch.
permissions:
  contents: read

# Where these jobs run. GitHub's own runners are the default because they are
# always there and cost nothing on a public repository, and because a pull
# request from a fork cannot reach our self-hosted ones at all. The self-hosted
# box is faster when it is up, so to send the jobs back to it set the repository
# variable CI_RUNNER to `self-hosted` (Settings > Secrets and variables >
# Actions > Variables); deleting the variable brings them back here. Nothing in
# this file assumes one or the other: every job installs what it needs.
#
# There is no way to fail over automatically. A job addressed to a runner that
# is offline queues rather than failing, and the API that would say whether one
# is online needs administration rights the workflow token does not have.

jobs:
  # Per-commit gate. clippy --all-targets type-checks every bin, test and example
  # in the workspace, which is most of the value here; `cargo test` runs beside
  # it rather than after, since the jobs run in parallel and neither is the
  # bottleneck.
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # --all-features turns on tapline-auth's `keyring`, which links
      # libdbus. The feature is off by default precisely because a headless
      # game-server node has no dbus — but it still has to compile, so CI
      # supplies the header rather than skipping the feature.
      - name: Install the dbus headers the keyring feature needs
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Network-touching tests are #[ignore]d, so this stays offline and
      # deterministic. They are run by hand against real Steam.
      - run: cargo test --workspace --all-features

  # The port to Windows is only a port while something checks it. Cross-checking
  # from the Linux runners is enough to catch the regression that matters -- a
  # `std::os::unix` import creeping back in -- and costs no new runner. `ring`
  # compiles C for the target, so this needs the mingw toolchain the same way
  # binary-size needs musl-tools.
  windows:
    name: Windows cross-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Install the mingw toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      # clippy --all-targets type-checks but never links. The CLI is what a
      # Windows user actually runs, so link it.
      - run: cargo build --target x86_64-pc-windows-gnu -p tapline-cli

  # The dependency floor is a floor: this fails on a new licence, a yanked crate,
  # an advisory, or anything from the deny list in deny.toml (openssl, hyper,
  # reqwest, prost, a C build).
  deny:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The official cargo-deny action runs in Docker, which the self-hosted
      # runners have no daemon for. This installs the same binary directly and
      # works wherever the job lands.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check all

  # The shipped binary has a size budget, and a budget nobody checks is a wish.
  # Also proves the static musl build works, which needs a musl-targeting C
  # compiler because rustls's `ring` backend compiles C for the target.
  binary-size:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils file

      - name: Build the release binary
        # `--no-default-features`, the same as the Dockerfile. The steamworks
        # bridge dlopens the Steam SDK, which a fully static musl binary cannot
        # do — so it is not in the container or this static build, only in the
        # dynamic desktop release binary. This job measures the lean static one.
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl -p tapline-cli

      - name: Check the size budget
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/tapline
          SIZE=$(stat -c%s "$BIN")
          LIMIT=$((4 * 1024 * 1024))
          echo "tapline is $SIZE bytes (budget $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::the binary is $SIZE bytes, over the $LIMIT budget"
            exit 1
          fi

      - name: It must actually be static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/tapline
          file "$BIN"
          # readelf, not ldd. A static binary is one with no DT_NEEDED entries
          # and no interpreter, and readelf answers that exactly. The previous
          # check grepped ldd's prose for "not a dynamic executable" -- but a
          # musl static binary makes glibc's ldd print "statically linked"
          # instead, which the expression read as a mismatch and reported as a
          # failure. It never got that far here, because `file` is not
          # installed on these runners and the step exited 127.
          if readelf -d "$BIN" 2>/dev/null | grep -q "(NEEDED)"; then
            echo "::error::the musl binary links shared libraries"
            readelf -d "$BIN" | grep "(NEEDED)"
            exit 1
          fi
          if readelf -l "$BIN" 2>/dev/null | grep -q "INTERP"; then
            echo "::error::the musl binary has a dynamic loader"
            exit 1
          fi
          echo "static: no NEEDED entries, no interpreter"

      - name: And it must run
        run: target/x86_64-unknown-linux-musl/release/tapline --version

  # The metadata build is what a webapp links: it must not drag in rayon, cap-std,
  # clap or serde. Asserted against the dependency graph rather than hoped for.
  minimal-graph:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No heavy crates in the metadata build
        run: |
          # Nothing to assert until the facade crate exists (M6); until then this
          # only proves the workspace resolves with default features off.
          cargo tree --workspace --no-default-features --edges normal > /tmp/graph.txt
          for crate in rayon cap-std clap serde_json; do
            if grep -qE "^[^a-z]*${crate} v" /tmp/graph.txt; then
              echo "::error::${crate} is in the default-features-off graph"
              exit 1
            fi
          done

  bindings:
    name: JS bindings
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the shared library
        run: cargo build --release -p tapline-ffi

      - name: It must export the C ABI
        run: |
          LIB=target/release/libtapline_ffi.so
          for symbol in tapline_install tapline_plan tapline_workshop_download \
                        tapline_job_next tapline_job_cancel tapline_job_free \
                        tapline_last_error tapline_version; do
            if ! nm -D --defined-only "$LIB" | grep -q " T $symbol$"; then
              echo "::error::$LIB does not export $symbol"
              exit 1
            fi
          done
          echo "all eight symbols exported"

      - name: The bindings must load and run
        working-directory: bindings/js
        run: |
          npm install --no-audit --no-fund koffi
          TAPLINE_LIB=$GITHUB_WORKSPACE/target/release/libtapline_ffi.so \
            node test/smoke.ts
